config-version: 1

# Автоматический переход в АФК по бездействию.
auto-afk:
  enabled: true
  # Сколько секунд бездействия до автоматического перехода в АФК.
  idle-seconds: 300

# Индикатор АФК для плейсхолдера %auriongo_afk% (PlaceholderAPI).
# Поддерживаются legacy-цвета через символ &.
indicator:
  # Значение, когда игрок в АФК (по умолчанию — золотые часы).
  afk: "&6⌚"
  # Значение, когда игрок не в АФК (по умолчанию — пусто).
  online: ""
