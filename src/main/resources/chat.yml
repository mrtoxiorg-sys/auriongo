config-version: 6

formatting:
  parser: MINI_MESSAGE
  placeholderapi:
    enabled: true
  legacy-colors:
    allow-ampersand: true
    allow-section: false
  input:
    chat:
      use-minimessage: true
      use-legacy-colors: true
    commands:
      use-minimessage: true
      use-legacy-colors: true
    permissions:
      legacy-colors: "auriongo.chat.color"
      minimessage: "auriongo.chat.minimessage"

channels:
  local:
    enabled: true
    radius: 150.0
    format: "<color:#4FD6FF>ʟ</color> <white>{player}</white> <dark_gray>»</dark_gray> <message>"
  global:
    enabled: true
    prefix: "!"
    format: "<color:#4FD6FF>ɢ</color> <white>{player}</white> <dark_gray>»</dark_gray> <message>"

formats:
  do: "<white>{player}</white> <dark_gray>»</dark_gray> <message>"
  private-message-sent: "<color:#4FD6FF>✉</color> <dark_gray>➜</dark_gray> <white>{target}</white> <dark_gray>»</dark_gray> <message>"
  private-message-received: "<color:#4FD6FF>✉</color> <dark_gray>⬳</dark_gray> <white>{player}</white> <dark_gray>»</dark_gray> <message>"
  private-message-self: "<color:#4FD6FF>✎</color> <color:#4FD6FF>Заметки</color> <dark_gray>»</dark_gray> <message>"

join-message:
  enabled: true
  format: "<color:#4FFF88>+ <color:#4FD6FF>{player}</color>"

quit-message:
  enabled: true
  format: "<color:#FF4F4F>- <color:#4FD6FF>{player}</color>"

commands:
  do:
    radius: 100.0
    usage: "<color:#FF4F4F>Использование: /do <действие>"
  msg:
    usage: "<color:#FF4F4F>Использование: /msg <игрок> <сообщение>"
  reply:
    usage: "<color:#FF4F4F>Использование: /r <сообщение>"

messages:
  player-only: "<color:#FF4F4F>Эту команду может использовать только игрок."
  player-not-found: "<color:#FF4F4F>Игрок <white>{target}</white> сейчас не в сети."
  reply-target-missing: "<color:#FF4F4F>Тебе еще никто не писал."
  reply-target-offline: "<color:#FF4F4F>Последний собеседник уже вышел с сервера."
  local-no-recipients-actionbar: "<color:#FF4F4F>Вас никто не услышал.</color>"
