config-version: 7

formatting:
  parser: MINI_MESSAGE
  placeholderapi:
    enabled: true
  legacy-colors:
    allow-ampersand: true
    allow-section: false
  input:
    chat:
      use-minimessage: true
      use-legacy-colors: true
    commands:
      use-minimessage: true
      use-legacy-colors: true
    permissions:
      legacy-colors: "auriongo.chat.color"
      minimessage: "auriongo.chat.minimessage"

channels:
  local:
    enabled: true
    radius: 150.0
  global:
    enabled: true
    prefix: "!"

join-message:
  enabled: true

quit-message:
  enabled: true

commands:
  do:
    radius: 100.0
