config-version: 2

usage:
  gm: |-
    <color:#4FD6FF>╭ Использование</color>
    <color:#4FD6FF>╰</color> <white>/gamemode <режим> [игрок]</white> <gray>или</gray> <white>/gm <режим> [игрок]</white>
  shortcut: |-
    <color:#4FD6FF>╭ Использование</color>
    <color:#4FD6FF>╰</color> <white>/{command} [игрок]</white>

modes:
  creative: "Креатив"
  survival: "Выживание"
  spectator: "Наблюдатель"
  adventure: "Приключение"

messages:
  self-change: "<color:#4FFF88>✦</color> <white>Ваш режим игры изменён на</white> <color:#4FD6FF>{mode}</color>"
  target-change: "<color:#4FFF88>✦</color> <white>{actor} изменил ваш режим игры на</white> <color:#4FD6FF>{mode}</color>"
  other-change: "<color:#4FFF88>✦</color> <white>Вы изменили режим игры игроку</white> <color:#4FD6FF>{target}</color> <white>на</white> <color:#4FD6FF>{mode}</color>"
  staff-notify-self: "<gray><i>{actor} изменил свой режим игры на {mode}</i></gray>"
  staff-notify-other: "<gray><i>{actor} изменил режим игры игроку {target} на {mode}</i></gray>"
